<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - ClipAI</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .dashboard {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .dash-top h1 {
      font-size: 38px;
    }

    .credits {
      background: #111;
      border: 1px solid #222;
      padding: 15px 20px;
      border-radius: 10px;
    }

    .credits span {
      color: #7cff00;
      font-weight: bold;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .project-card {
      background: #101010;
      border: 1px solid #222;
      padding: 25px;
      border-radius: 15px;
    }

    .status {
      color: #7cff00;
      font-size: 13px;
      margin-top: 10px;
    }

    @media(max-width:700px) {
      .dash-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .projects {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">
    CLIP<span>AI</span>
  </a>

  <a href="create.html" class="nav-btn">
    + New Project
  </a>

</header>

<main class="dashboard">

  <div class="dash-top">

    <div>
      <p style="color:#7cff00;">DASHBOARD</p>
      <h1>Your Projects</h1>
    </div>

    <div class="credits">
      Credits:
      <span>10 min</span>
    </div>

  </div>

  <div class="projects">

    <div class="project-card">

      <h3>Welcome Project</h3>

      <p style="color:#777;">
        Your generated clips will appear here.
      </p>

      <div class="status">
        ● Ready
      </div>

    </div>

  </div>

</main>

</body>
</html>
